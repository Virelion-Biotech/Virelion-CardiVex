[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "virelion-cardivex"
version = "0.3.0"
description = "Computational cardiac challenge and defensive evaluation platform."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cardivex = "cardivex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cardivex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
