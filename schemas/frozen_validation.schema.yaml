$schema: https://json-schema.org/draft/2020-12/schema
$title: CardiVex Frozen Validation Run
$type: object
required: [artifact_id, held_out_group_count, scenario_count, results, summary, clean_split, run_id]
properties:
  artifact_id: {type: string, minLength: 1}
  held_out_group_count: {type: integer, minimum: 1}
  scenario_count: {type: integer, minimum: 1}
  results:
    type: array
    items: {type: object}
  summary:
    type: object
    additionalProperties: true
  clean_split: {type: boolean}
  run_id: {type: string, minLength: 1}
