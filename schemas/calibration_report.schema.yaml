$schema: "https://json-schema.org/draft/2020-12/schema"
title: CardiVex Calibration Report
type: object
properties:
  scenario_id:
    type: string
  metrics:
    type: object
    additionalProperties:
      type: number
  uncertainty:
    type: object
    additionalProperties:
      type: object
      properties:
        mean: {type: number}
        lower: {type: number}
        upper: {type: number}
        count: {type: integer, minimum: 1}
      required: [mean, lower, upper, count]
required: [scenario_id, metrics, uncertainty]
