name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest

  real-data-smoke:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - name: Real-data smoke (skip if download/SHA fails)
        env:
          GSE144424_URL: https://www.ncbi.nlm.nih.gov/geo/download/?acc=GSE144424&format=file&file=GSE144424%5FCounts%5FRNA%5FMCW%5FNEB%2Etxt%2Egz
        run: |
          set -euo pipefail
          mkdir -p data
          if [[ ! -f data/GSE144424_Counts_RNA_MCW_NEB.txt.gz ]]; then
            echo "Downloading GSE144424 counts..."
            curl -fsSL -o data/GSE144424_Counts_RNA_MCW_NEB.txt.gz "$GSE144424_URL" || {
              echo "Download failed; skipping real-data smoke."
              exit 0
            }
          fi
          EXPECTED=cad9ac4c6514550ea9bfb2b491cc2934f6952894d7cbd17338d5054d03da6f7c
          GOT=$(sha256sum data/GSE144424_Counts_RNA_MCW_NEB.txt.gz | awk '{print $1}')
          if [[ "$GOT" != "$EXPECTED" ]]; then
            echo "SHA256 mismatch: $GOT (expected $EXPECTED); skipping."
            exit 0
          fi
          if [[ ! -f data/GSE234907_Heart_counts.txt.gz ]]; then
            python scripts/run_full_validation.py --skip-external
          else
            python scripts/run_full_validation.py
          fi
          test -f reports/GSE144424_loso_temporal_benchmark_v0.2.json
          test -f reports/FULL_VALIDATION_SUMMARY_2026-08-30.json
          python - <<'PY'
          import json
          s = json.load(open("reports/FULL_VALIDATION_SUMMARY_2026-08-30.json"))
          assert s["status"] == "ok"
          assert s["loso_fold_count"] == 15
          assert s["source_sha256"] == "cad9ac4c6514550ea9bfb2b491cc2934f6952894d7cbd17338d5054d03da6f7c"
          print("real-data smoke ok", s["frozen_artifact_id"])
          PY
