name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest --cov=cardivex --cov-fail-under=85
  scientific-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,reference]'
      - run: python -m pytest tests/test_scientific_reference.py
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/cardivex-wheel
          /tmp/cardivex-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/cardivex-wheel/bin/cardivex --help
          /tmp/cardivex-wheel/bin/python -c "from importlib.metadata import version; assert version('virelion-cardivex') == '0.4.0'"
  real-data-validation:
    runs-on: ubuntu-latest
    needs: [unit, scientific-reference, package]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Download and verify all required archives
        run: python scripts/download_validation_data.py
      - name: Generate fresh outputs and verify empirical contracts
        run: |
          set -euo pipefail
          OUTPUT=$(mktemp -d)
          python scripts/run_full_validation.py --output-dir "$OUTPUT"
          python scripts/run_improved_classification.py --output-dir "$OUTPUT"
          python scripts/run_next_validation_bundle.py --output-dir "$OUTPUT"
          python scripts/verify_real_validation.py "$OUTPUT"
          mkdir -p validation/ci
          cp "$OUTPUT"/*.json validation/ci/
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-cpu-validation
          path: validation/ci/*.json
          if-no-files-found: error
